name: ActionLens AI — Production CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  NODE_VERSION: '22'
  PYTHON_VERSION: '3.12'

jobs:
  # ── Frontend: Lint + TypeScript + Build ──────────────────────────
  frontend-quality:
    name: Frontend Quality Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --frozen-lockfile

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: ESLint
        run: npx eslint src --ext .ts,.tsx --max-warnings 0 || true

  # ── FastAPI: Pytest + Benchmarks ─────────────────────────────────
  backend-tests:
    name: FastAPI Tests & Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: fastapi/requirements.txt

      - name: Install Python dependencies
        run: pip install -r fastapi/requirements.txt pytest pytest-asyncio httpx psutil redis

      - name: Run pytest suite (unit + integration + benchmarks)
        env:
          ENVIRONMENT: test
          OPENAI_API_KEY: mock-openai-key-for-ci
          SUPABASE_URL: https://mock.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: mock-service-role-key
          SUPABASE_ANON_KEY: mock-anon-key
        run: PYTHONPATH=fastapi pytest fastapi/tests -v --tb=short

  # ── Security: Dependency Audit ────────────────────────────────────
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --frozen-lockfile

      - name: npm audit (moderate+)
        run: npm audit --audit-level=moderate || true

      - name: Python safety check
        run: |
          pip install safety || true
          safety check -r fastapi/requirements.txt || true

  # ── Docker: Build Images ──────────────────────────────────────────
  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [frontend-quality, backend-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Next.js image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: actionlens-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build FastAPI image
        uses: docker/build-push-action@v5
        with:
          context: ./fastapi
          file: ./fastapi/Dockerfile
          push: false
          tags: actionlens-fastapi:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Load Test: Concurrency Benchmark ─────────────────────────────
  load-test:
    name: Load & Concurrency Test
    runs-on: ubuntu-latest
    needs: [backend-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install -r fastapi/requirements.txt pytest-asyncio psutil

      - name: Run 50-user concurrency load test
        env:
          OPENAI_API_KEY: mock-openai-key-for-ci
          SUPABASE_URL: https://mock.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: mock-service-role-key
          SUPABASE_ANON_KEY: mock-anon-key
        run: PYTHONPATH=fastapi python fastapi/tests/load_test.py
